<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lotecito, inicio del sembrador (datos de ejemplo)</title>
    <!--
      Maqueta del Inicio del sembrador de Lotecito, con datos de ejemplo.
      Reproduce a mano las medidas de la app real (Tailwind 4, letra del celular
      al 137,5 %: por eso todo va en rem). Nombres y números inventados.
      Tipografía: Atkinson Hyperlegible Next (SIL OFL, ver atkinson-OFL.txt).
      Foto de campo: Tom De Decker en Unsplash (licencia de Unsplash).
      Íconos: Phosphor (MIT), los mismos que usa la app.
    -->
    <style>
      @font-face {
        font-family: 'Atkinson Hyperlegible Next';
        src: url('atkinson.woff2') format('woff2');
        font-weight: 200 800;
        font-style: normal;
        font-display: block;
      }

      :root {
        --font-sans: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif;
        --color-monte: #183826;
        --color-marca: #21573c;
        --color-maiz: #f4b731;
        --color-fondo: #eef2ec;
        --color-papel: #fcfdfb;
        --color-borde: #d3dbd5;
        --color-slate-100: oklch(96.8% 0.006 155);
        --color-slate-600: oklch(44.6% 0.02 155);
        --color-slate-700: oklch(37.2% 0.022 155);
        --color-slate-900: oklch(20.8% 0.022 155);
        /* Alto de la barra de estado y de la barra de gestos del sistema. */
        --alto-estado: 38px;
        --alto-gestos: 24px;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        border: 0 solid transparent;
      }

      /* La app agranda la letra de toda la raíz en el celular: 137,5 %. */
      html {
        font-family: var(--font-sans);
        font-size: 137.5%;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
      }

      /* Pantalla de 412 x 915 px CSS (un Android común de hoy). */
      body {
        width: 412px;
        height: 915px;
        overflow: hidden;
        background: var(--color-fondo);
        color: var(--color-slate-900);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      svg {
        display: block;
        fill: currentColor;
      }

      /* La pantalla entera: barra de estado, la app y la barra de gestos. */
      .pantalla {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
      }

      /* ---------- Barra de estado (dibujada, sin operador ni hora reales) ---------- */
      .estado {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
        height: var(--alto-estado);
        padding: 0 1.25rem 0 1.5rem;
        background: var(--color-monte);
        color: #fff;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.01em;
      }
      .estado .derecha {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .estado svg {
        width: 0.8rem;
        height: 0.8rem;
      }
      .estado .bateria {
        display: flex;
        align-items: center;
        gap: 0.1rem;
      }
      .estado .bateria svg {
        width: 1.05rem;
        height: 1.05rem;
      }

      /* ---------- La app ---------- */
      .app {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }

      /* Cabecera con la foto de campo y el velo de monte (FotoDeCampo.tsx). */
      .cabecera {
        position: relative;
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        padding: 1rem 1.25rem 1.25rem;
        background: var(--color-monte);
        color: #fff;
      }
      .foto {
        position: absolute;
        inset: 0;
        overflow: hidden;
        pointer-events: none;
      }
      .foto img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
      }
      .foto::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgb(24 56 38 / 0.66),
          rgb(24 56 38 / 0.74) 45%,
          rgb(24 56 38 / 0.92)
        );
      }
      .cabecera .fila {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .marca {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 1.125rem;
        line-height: 1.75rem;
        font-weight: 800;
        color: #fff;
      }
      .marca img {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 0.5rem;
        box-shadow: 0 0 0 1px rgb(255 255 255 / 0.3);
      }
      .envio {
        display: flex;
        align-items: center;
        gap: 0.375rem;
        font-size: 1rem;
        line-height: 1.5rem;
        font-weight: 700;
        color: #fff;
      }
      .envio svg {
        flex-shrink: 0;
        width: 1.5rem;
        height: 1.5rem;
      }
      .saludo {
        position: relative;
        margin-top: 1rem;
      }
      .saludo h1 {
        font-size: 1.875rem;
        line-height: 1.25;
        font-weight: 800;
      }
      .saludo p {
        font-size: 1.125rem;
        line-height: 1.75rem;
        font-weight: 700;
        color: oklch(96.8% 0.006 155);
      }

      /* Cuerpo. */
      .hoja {
        display: flex;
        flex: 1;
        flex-direction: column;
        gap: 1.5rem;
        padding: 1.5rem 1rem 1rem;
      }
      .hiciste {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      .rotulo {
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 800;
        color: var(--color-slate-900);
      }

      /* Los tres cuadritos de hectáreas (CuadritosDeHectareas.tsx). */
      .cuadritos {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.375rem;
        list-style: none;
      }
      .cuadrito {
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        min-width: 0;
        border: 2px solid var(--color-borde);
        border-radius: 0.75rem;
        background: var(--color-papel);
        padding: 0.625rem 0.5rem;
      }
      .cuadrito .titulo {
        font-size: 0.75rem;
        line-height: 1rem;
        font-weight: 700;
        color: var(--color-slate-600);
      }
      .cuadrito .valor {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        column-gap: 0.25rem;
      }
      .cuadrito .cifra {
        font-weight: 800;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
        color: var(--color-slate-900);
      }
      /* Como en la app, el número se achica según cuántos caracteres tiene (cqi =
         1 % del ancho del cuadrito por dentro). Acá se achican un poco más que en
         la app, para que "ha" quede al lado del número y no abajo. */
      .cifra.c3 {
        font-size: min(1.875rem, 34cqi);
      }
      .cifra.c4 {
        font-size: min(1.875rem, 30cqi);
      }
      .cuadrito .unidad {
        font-size: 1rem;
        line-height: 1.5rem;
        font-weight: 700;
        color: var(--color-slate-700);
      }
      .cuadrito .lotes {
        font-size: 0.875rem;
        line-height: 1.25rem;
        color: var(--color-slate-600);
      }

      /* Accesos: Lo que cargué, Mi resumen. */
      .accesos {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 2px solid var(--color-borde);
        border-radius: 0.75rem;
        background: var(--color-papel);
      }
      .acceso {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 4rem;
        padding: 0 1.25rem;
        font-size: 1.25rem;
        line-height: 1.75rem;
        font-weight: 700;
        color: var(--color-slate-900);
      }
      .acceso + .acceso {
        border-top: 2px solid var(--color-borde);
      }
      .acceso span {
        flex: 1;
      }
      .acceso svg {
        flex-shrink: 0;
        color: var(--color-marca);
      }
      .acceso .icono {
        width: 1.75rem;
        height: 1.75rem;
      }
      .acceso .flecha {
        width: 1.5rem;
        height: 1.5rem;
      }

      /* Botón fijo abajo: Cargar un lote. */
      .pie {
        display: grid;
        flex-shrink: 0;
        border-top: 2px solid var(--color-borde);
        background: var(--color-papel);
        padding: 0.625rem 0.75rem 1rem;
      }
      .cargar {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 3.5rem;
        border-radius: 0.75rem;
        background: var(--color-maiz);
        padding: 0.375rem 0.5rem;
        text-align: center;
        font-size: 1rem;
        line-height: 1.25;
        font-weight: 800;
        color: var(--color-slate-900);
        box-shadow: inset 0 -5px 0 rgb(0 0 0 / 0.16);
      }
      .cargar svg {
        width: 1.75rem;
        height: 1.75rem;
      }

      /* ---------- Barra de gestos del sistema ---------- */
      .gestos {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        height: var(--alto-gestos);
        background: var(--color-papel);
      }
      .gestos i {
        width: 6.5rem;
        height: 0.25rem;
        border-radius: 999px;
        background: oklch(37.2% 0.022 155);
      }
    </style>
  </head>
  <body>
    <div class="pantalla">
      <div class="estado" aria-hidden="true">
        <span>9:41</span>
        <span class="derecha">
          <!-- Phosphor CellSignalFull, fill -->
          <svg viewBox="0 0 256 256">
            <path
              d="M208,40V200a16,16,0,0,1-16,16H32A16,16,0,0,1,20.7,188.68l160-160A16,16,0,0,1,208,40Z"
            />
          </svg>
          <!-- Phosphor WifiHigh, fill -->
          <svg viewBox="0 0 256 256">
            <path
              d="M244.35,92.8l-104,125.43A15.93,15.93,0,0,1,128,224h0a15.93,15.93,0,0,1-12.31-5.77L11.65,92.8A15.65,15.65,0,0,1,8.11,80.91,15.93,15.93,0,0,1,14.28,70.1,186.67,186.67,0,0,1,128,32,186.67,186.67,0,0,1,241.72,70.1a15.93,15.93,0,0,1,6.17,10.81A15.65,15.65,0,0,1,244.35,92.8Z"
            />
          </svg>
          <span class="bateria">
            <!-- Phosphor BatteryFull, fill -->
            <svg viewBox="0 0 256 256">
              <path
                d="M200,56H32A24,24,0,0,0,8,80v96a24,24,0,0,0,24,24H200a24,24,0,0,0,24-24V80A24,24,0,0,0,200,56Zm8,120a8,8,0,0,1-8,8H32a8,8,0,0,1-8-8V80a8,8,0,0,1,8-8H200a8,8,0,0,1,8,8ZM192,96v64a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V96a8,8,0,0,1,8-8H184A8,8,0,0,1,192,96Zm64,0v64a8,8,0,0,1-16,0V96a8,8,0,0,1,16,0Z"
              />
            </svg>
          </span>
        </span>
      </div>

      <div class="app">
        <header class="cabecera">
          <div class="foto" aria-hidden="true"><img src="campo.webp" alt="" /></div>
          <div class="fila">
            <span class="marca"><img src="logo.svg" alt="" />Lotecito</span>
            <p class="envio">
              <!-- Phosphor CloudCheck, bold -->
              <svg viewBox="0 0 256 256" aria-hidden="true">
                <path
                  d="M160,36A92.09,92.09,0,0,0,79,84.36,68,68,0,1,0,72,220h88a92,92,0,0,0,0-184Zm0,160H72a44,44,0,0,1-1.82-88A91.86,91.86,0,0,0,68,128a12,12,0,0,0,24,0,68,68,0,1,1,68,68Zm40.49-92.49a12,12,0,0,1,0,17l-48,48a12,12,0,0,1-17,0l-24-24a12,12,0,1,1,17-17L144,143l39.51-39.52A12,12,0,0,1,200.49,103.51Z"
                />
              </svg>
              Todo enviado
            </p>
          </div>
          <div class="saludo">
            <h1>Hola, Ramiro</h1>
            <p>Jueves 15 de octubre</p>
          </div>
        </header>

        <div class="hoja">
          <section class="hiciste" aria-labelledby="hiciste">
            <h2 id="hiciste" class="rotulo">Hiciste</h2>
            <ul class="cuadritos">
              <li class="cuadrito">
                <span class="titulo">Semana</span>
                <span class="valor"
                  ><span class="cifra c4">86,5</span><span class="unidad">ha</span></span
                >
                <span class="lotes">3 lotes</span>
              </li>
              <li class="cuadrito">
                <span class="titulo">Mes</span>
                <span class="valor"
                  ><span class="cifra c3">214</span><span class="unidad">ha</span></span
                >
                <span class="lotes">6 lotes</span>
              </li>
              <li class="cuadrito">
                <span class="titulo">Campaña</span>
                <span class="valor"
                  ><span class="cifra c3">702</span><span class="unidad">ha</span></span
                >
                <span class="lotes">14 lotes</span>
              </li>
            </ul>
          </section>

          <nav class="accesos" aria-label="Más">
            <a class="acceso" href="#">
              <!-- Phosphor ClockCounterClockwise, bold -->
              <svg class="icono" viewBox="0 0 256 256" aria-hidden="true">
                <path
                  d="M140,80v41.21l34.17,20.5a12,12,0,1,1-12.34,20.58l-40-24A12,12,0,0,1,116,128V80a12,12,0,0,1,24,0ZM128,28A99.38,99.38,0,0,0,57.24,57.34c-4.69,4.74-9,9.37-13.24,14V64a12,12,0,0,0-24,0v40a12,12,0,0,0,12,12H72a12,12,0,0,0,0-24H57.77C63,86,68.37,80.22,74.26,74.26a76,76,0,1,1,1.58,109,12,12,0,0,0-16.48,17.46A100,100,0,1,0,128,28Z"
                />
              </svg>
              <span>Lo que cargué</span>
              <!-- Phosphor CaretRight, bold -->
              <svg class="flecha" viewBox="0 0 256 256" aria-hidden="true">
                <path
                  d="M184.49,136.49l-80,80a12,12,0,0,1-17-17L159,128,87.51,56.49a12,12,0,1,1,17-17l80,80A12,12,0,0,1,184.49,136.49Z"
                />
              </svg>
            </a>
            <a class="acceso" href="#">
              <!-- Phosphor ChartBar, bold -->
              <svg class="icono" viewBox="0 0 256 256" aria-hidden="true">
                <path
                  d="M224,196h-4V40a12,12,0,0,0-12-12H152a12,12,0,0,0-12,12V76H96A12,12,0,0,0,84,88v36H48a12,12,0,0,0-12,12v60H32a12,12,0,0,0,0,24H224a12,12,0,0,0,0-24ZM164,52h32V196H164Zm-56,48h32v96H108ZM60,148H84v48H60Z"
                />
              </svg>
              <span>Mi resumen</span>
              <svg class="flecha" viewBox="0 0 256 256" aria-hidden="true">
                <path
                  d="M184.49,136.49l-80,80a12,12,0,0,1-17-17L159,128,87.51,56.49a12,12,0,1,1,17-17l80,80A12,12,0,0,1,184.49,136.49Z"
                />
              </svg>
            </a>
          </nav>
        </div>

        <nav class="pie" aria-label="Cargar">
          <a class="cargar" href="#">
            <!-- Phosphor Tractor, fill -->
            <svg viewBox="0 0 256 256" aria-hidden="true">
              <path
                d="M80,172a12,12,0,1,1-12-12A12,12,0,0,1,80,172Zm40,0a52,52,0,1,1-52-52A52.06,52.06,0,0,1,120,172Zm-24,0a28,28,0,1,0-28,28A28,28,0,0,0,96,172Zm152,16a36,36,0,0,1-71.77,4H144a8,8,0,0,1-8-8V172a68.07,68.07,0,0,0-68-68H40a8,8,0,0,1,0-16h8V56H40a8,8,0,0,1,0-16H160a8,8,0,0,1,0,16h-8V97.88l24,6.5V72a8,8,0,0,1,16,0v36.71l36.39,9.86.21.06A15.89,15.89,0,0,1,240,134v31.46A35.8,35.8,0,0,1,248,188Zm-20,0a16,16,0,1,0-16,16A16,16,0,0,0,228,188Z"
              />
            </svg>
            Cargar un lote
          </a>
        </nav>
      </div>

      <div class="gestos" aria-hidden="true"><i></i></div>
    </div>
  </body>
</html>
