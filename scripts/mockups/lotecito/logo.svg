<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- El ícono de Lotecito: un lote con los surcos y el sol saliendo, en monte
       y maíz. Los PNG de public/ son este mismo dibujo sin las esquinas
       redondeadas (el celular las recorta a su gusto). -->
  <clipPath id="esquinas"><rect width="512" height="512" rx="96"/></clipPath>
  <g clip-path="url(#esquinas)">
    <rect width="512" height="512" fill="#183826"/>
    <circle cx="256" cy="268" r="96" fill="#f4b731"/>
    <polygon points="256,268 -420,512 -150,512" fill="#21573c"/>
    <polygon points="256,268 -150,512 40,512" fill="#2e6b4a"/>
    <polygon points="256,268 40,512 180,512" fill="#21573c"/>
    <polygon points="256,268 180,512 332,512" fill="#2e6b4a"/>
    <polygon points="256,268 332,512 472,512" fill="#21573c"/>
    <polygon points="256,268 472,512 662,512" fill="#2e6b4a"/>
    <polygon points="256,268 662,512 932,512" fill="#21573c"/>
    <rect y="262" width="512" height="10" fill="#f4b731"/>
  </g>
</svg>
